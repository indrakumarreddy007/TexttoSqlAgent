<style>
/* Layout: reference catalogue. Header with build facts, tab strip (hash-routed), one working column; table list + detail side by side on wide screens. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #18212e; --muted: #5a6577; --rule: #dde2ea;
  --accent: #1f5f8b; --accent-soft: #e4eef6; --code: #eef1f5;
  --ok: #23774a; --ok-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fbf0db; --bad: #b3372f; --bad-soft: #fbe6e4;
  --f-display: "IBM Plex Serif", Georgia, serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --surface: #182029; --ink: #e3e8ef; --muted: #9aa6b6; --rule: #2b3543;
  --accent: #7db7e0; --accent-soft: #1c2e3d; --code: #1e2733;
  --ok: #6cc895; --ok-soft: #173325; --warn: #e2b04f; --warn-soft: #33290f; --bad: #ef8a80; --bad-soft: #3a1d1b;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #182029; --ink: #e3e8ef; --muted: #9aa6b6; --rule: #2b3543;
  --accent: #7db7e0; --accent-soft: #1c2e3d; --code: #1e2733;
  --ok: #6cc895; --ok-soft: #173325; --warn: #e2b04f; --warn-soft: #33290f; --bad: #ef8a80; --bad-soft: #3a1d1b;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--rule); }
header.top .wrap { padding-block: 22px 0; }
h1 { font: 600 28px/1.2 var(--f-display); margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 16px; max-width: 75ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.fact { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.fact b { display: block; font: 600 20px/1.2 var(--f-body); font-variant-numeric: tabular-nums; }
.fact span { font: 12px var(--f-mono); color: var(--muted); }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
nav.tabs a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 20px 80px; }
h2 { font: 600 19px/1.3 var(--f-display); margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 80ch; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.name { font: 500 14px var(--f-mono); }
.meta { font: 12px var(--f-mono); color: var(--muted); }
.pill { font: 500 11px/1 var(--f-mono); padding: 4px 7px; border-radius: 99px; white-space: nowrap; background: var(--code); color: var(--muted); }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); } .p-acc { background: var(--accent-soft); color: var(--accent); }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
th { background: var(--code); font: 500 11.5px var(--f-mono); white-space: nowrap; }
td { white-space: nowrap; } td.wrap-text { white-space: normal; min-width: 220px; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
pre { font: 12.5px/1.5 var(--f-mono); background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0 0; white-space: pre; }
code { font: 12.5px var(--f-mono); }
.split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .split { grid-template-columns: minmax(0, 1fr); } }
.tlist { display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 820px) { .tlist { position: static; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
.tlist button { text-align: left; border: 1px solid transparent; background: none; border-radius: 6px; padding: 6px 9px; cursor: pointer; color: var(--ink); font: inherit; }
.tlist button[aria-pressed="true"] { background: var(--surface); border-color: var(--rule); }
.tlist .name { display: block; } .tlist .meta { display: block; }
input.search { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.s-public, .s-internal { } .s-pii_direct { background: var(--bad-soft); color: var(--bad); }
.s-pii_sensitive { background: var(--warn-soft); color: var(--warn); } .s-free_text { background: var(--accent-soft); color: var(--accent); }
h4 { margin: 14px 0 4px; font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 8px; }
.q { font-size: 15.5px; font-weight: 500; margin: 4px 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.arrow { color: var(--muted); }
</style>

NCT h.ord_id)\nFROM sales.ord_hdr h\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')"},{"id":"aov_usd","label":"Average order value (USD)","description":"Net revenue / orders.","owner":"finance-data@halcyon.example","synonyms":["aov","average order value","basket size","average basket"],"sql":"SELECT SUM(l.price_lcl * fx.rate) / COUNT(DISTINCT h.ord_id)\nFROM sales.ord_hdr h JOIN sales.ord_line l ON l.ord_id = h.ord_id JOIN finance.fx_rate_daily fx ON fx.rate_dt = CAST(h.purch_ts AS DATE)\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')"},{"id":"active_customers","label":"Active customers","description":"Unique people (cust_uid) with at least one non-canceled order in the period.","owner":"crm-data@halcyon.example","synonyms":["active customers","unique customers","number of customers","how many customers","customer count","buyers"],"sql":"SELECT COUNT(DISTINCT c.cust_uid)\nFROM sales.ord_hdr h JOIN crm.CUST_MSTR_V2 c ON c.cust_id = h.cust_id AND c.is_current\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')"},{"id":"avg_review_score","label":"Average review score","description":"Mean review score (1-5) of reviews for orders placed in the period.","owner":"cx-data@halcyon.example","synonyms":["rating","review score","satisfaction","csat","average rating"],"sql":"SELECT AVG(r.score)\nFROM sales.ord_hdr h JOIN cx.review r ON r.ord_id = h.ord_id"},{"id":"late_delivery_rate","label":"Late delivery rate","description":"Share of delivered orders delivered after the promised date.","owner":"ops-data@halcyon.example","synonyms":["late deliveries","late rate","on-time","delivery delays"],"sql":"SELECT AVG(CASE WHEN CAST(h.dlvr_ts AS DATE) > h.est_dlvr_dt THEN 1.0 ELSE 0.0 END)\nFROM sales.ord_hdr h\nWHERE h.ord_stat_cd = 'delivered' AND h.dlvr_ts IS NOT NULL"},{"id":"avg_delivery_days","label":"Average delivery time (days)","description":"Mean days from purchase to delivery, delivered orders only.","owner":"ops-data@halcyon.example","synonyms":["delivery time","shipping time","lead time","days to deliver"],"sql":"SELECT AVG(date_diff('day', h.purch_ts, h.dlvr_ts))\nFROM sales.ord_hdr h\nWHERE h.ord_stat_cd = 'delivered' AND h.dlvr_ts IS NOT NULL"},{"id":"headcount","label":"Headcount","description":"Current employees (not attrited).","owner":"people-data@halcyon.example","synonyms":["headcount","employees","staff count","number of employees"],"sql":"SELECT COUNT(DISTINCT e.emp_id)\nFROM hr.employee e\nWHERE NOT e.is_attrited"},{"id":"attrition_rate","label":"Attrition rate","description":"Share of employees who have left.","owner":"people-data@halcyon.example","synonyms":["attrition","turnover rate","churn rate","attrition rate"],"sql":"SELECT AVG(CASE WHEN e.is_attrited THEN 1.0 ELSE 0.0 END)\nFROM hr.employee e"},{"id":"avg_monthly_income","label":"Average monthly income (USD)","description":"Mean monthly income. Aggregate-only, groups of at least 5 employees.","owner":"people-data@halcyon.example","synonyms":["average salary","avg salary","average pay","mean income","compensation"],"sql":"SELECT AVG(p.monthly_income)\nFROM hr.employee e JOIN hr.pay p ON p.emp_id = e.emp_id"}],"examples":[{"question":"Total net revenue in calendar year 2016","role":"analyst","sql":"SELECT ROUND(SUM(l.price_lcl * fx.rate), 2) AS net_revenue_usd\nFROM sales.ord_hdr h\nJOIN sales.ord_line l ON l.ord_id = h.ord_id\nJOIN finance.fx_rate_daily fx ON fx.rate_dt = CAST(h.purch_ts AS DATE)\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')\n  AND h.purch_ts >= TIMESTAMP '2016-01-01' AND h.purch_ts < TIMESTAMP '2017-01-01'\n"},{"question":"Number of orders by customer region in FY2017","role":"analyst","sql":"SELECT r.region_nm AS region, COUNT(DISTINCT h.ord_id) AS orders\nFROM sales.ord_hdr h\nJOIN crm.\"CUST_MSTR_V2\" c ON c.cust_id = h.cust_id AND c.is_current\nJOIN ref.region r ON r.state_cd = c.cust_state\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')\n  AND h.purch_ts >= TIMESTAMP '2016-04-01' AND h.purch_ts < TIMESTAMP '2017-04-01'\nGROUP BY 1\n"},{"question":"Top 3 sellers by GMV in FY2017","role":"analyst","sql":"SELECT l.seller_id, ROUND(SUM((l.price_lcl + l.frt_lcl) * fx.rate), 2) AS gmv_usd\nFROM sales.ord_hdr h\nJOIN sales.ord_line l ON l.ord_id = h.ord_id\nJOIN finance.fx_rate_daily fx ON fx.rate_dt = CAST(h.purch_ts AS DATE)\nWHERE h.purch_ts >= TIMESTAMP '2016-04-01' AND h.purch_ts < TIMESTAMP '2017-04-01'\nGROUP BY 1 ORDER BY 2 DESC LIMIT 3\n"},{"question":"Net revenue by English product category in calendar 2016","role":"analyst","sql":"SELECT x.cat_nm_en AS category, ROUND(SUM(l.price_lcl * fx.rate), 2) AS net_revenue_usd\nFROM sales.ord_hdr h\nJOIN sales.ord_line l ON l.ord_id = h.ord_id\nJOIN finance.fx_rate_daily fx ON fx.rate_dt = CAST(h.purch_ts AS DATE)\nJOIN product.prod p ON p.prod_id = l.prod_id\nJOIN product.cat_xlate x ON x.cat_nm_pt = p.cat_nm_pt\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')\n  AND h.purch_ts >= TIMESTAMP '2016-01-01' AND h.purch_ts < TIMESTAMP '2017-01-01'\nGROUP BY 1 ORDER BY 2 DESC\n"},{"question":"Unique customers per state in FY2017","role":"analyst","sql":"SELECT c.cust_state AS state, COUNT(DISTINCT c.cust_uid) AS active_customers\nFROM sales.ord_hdr h\nJOIN crm.\"CUST_MSTR_V2\" c ON c.cust_id = h.cust_id AND c.is_current\nWHERE h.ord_stat_cd NOT IN ('canceled', 'unavailable')\n  AND h.purch_ts >= TIMESTAMP '2016-04-01' AND h.purch_ts < TIMESTAMP '2017-04-01'\nGROUP BY 1\n"},{"question":"Late delivery rate by seller state in FY2017","role":"analyst","sql":"SELECT s.seller_state, AVG(CASE WHEN CAST(h.dlvr_ts AS DATE) > h.est_dlvr_dt THEN 1.0 ELSE 0.0 END)\n       AS late_delivery_rate\nFROM sales.ord_hdr h\nJOIN sales.ord_line l ON l.ord_id = h.ord_id AND l.line_no = 1\nJOIN ops.seller s ON s.seller_id = l.seller_id\nWHERE h.ord_stat_cd = 'delivered' AND h.dlvr_ts IS NOT NULL\n  AND h.purch_ts >= TIMESTAMP '2016-04-01' AND h.purch_ts < TIMESTAMP '2017-04-01'\nGROUP BY 1\n"},{"question":"Average delivery days per month in calendar 2016","role":"analyst","sql":"SELECT date_trunc('month', h.purch_ts) AS month, AVG(date_diff('day', h.purch_ts, h.dlvr_ts))\n       AS avg_delivery_days\nFROM sales.ord_hdr h\nWHERE h.ord_stat_cd = 'delivered' AND h.dlvr_ts IS NOT NULL\n  AND h.purch_ts >= TIMESTAMP '2016-01-01' AND h.purch_ts < TIMESTAMP '2017-01-01'\nGROUP BY 1 ORDER BY 1\n"},{"question":"Headcount by work state","role":"hr_analyst","sql":"SELECT e.work_state, COUNT(DISTINCT e.emp_id) AS headcount\nFROM hr.employee e\nWHERE NOT e.is_attrited\nGROUP BY 1\n"},{"question":"Average monthly income by job level","role":"hr_analyst","sql":"SELECT e.job_lvl, AVG(p.monthly_income) AS avg_monthly_income\nFROM hr.employee e\nJOIN hr.pay p ON p.emp_id = e.emp_id\nGROUP BY 1\n"}],"roles":[{"name":"admin","description":"Unrestricted read for data stewards","schemas":["*"],"sensitivity":{"pii_direct":"allow","pii_sensitive":"allow","free_text":"allow"},"row_filters":[],"aggregate_only":[],"max_rows":100000},{"name":"exec","description":"Executive: all commercial data, all regions; customer PII masked","schemas":["sales","crm","product","ops","cx","finance","ref"],"sensitivity":{"pii_direct":"mask","pii_sensitive":"deny","free_text":"allow"},"row_filters":[],"aggregate_only":[],"max_rows":5000},{"name":"regional_mgr","description":"Regional manager: commercial data for own regions only; no PII","schemas":["sales","crm","product","ops","cx","finance","ref"],"sensitivity":{"pii_direct":"deny","pii_sensitive":"deny","free_text":"mask"},"row_filters":["crm.cust_mstr_v2","sales.ord_hdr","sales.ord_line","sales.pmt","cx.review","ops.seller"],"aggregate_only":[],"max_rows":1000},{"name":"analyst","description":"Business analyst: commercial data, all regions; no PII, no free text","schemas":["sales","crm","product","ops","cx","finance","ref"],"sensitivity":{"pii_direct":"deny","pii_sensitive":"deny","free_text":"deny"},"row_filters":[],"aggregate_only":[],"max_rows":1000},{"name":"hr_analyst","description":"People     el("p", { class: "lead", text: "From config/policy.yaml. The guardrail engine enforces these on every query, whatever SQL the model writes." }));
  const g = el("div", { class: "grid2" });
  for (const r of D.roles) g.append(el("div", { class: "card" },
    el("div", { class: "row" }, el("span", { class: "name", text: r.name }), el("span", { class: "meta", text: `max ${num(r.max_rows)} rows` })),
    el("p", { text: r.description }),
    el("p", { class: "meta", text: "Schemas: " + r.schemas.join(", ") }),
    el("div", { class: "row" }, ...Object.entries(r.sensitivity).map(([k, v]) => el("span", { class: "pill " + (v === "allow" ? "p-ok" : v === "mask" ? "p-warn" : "p-bad"), text: `${k}: ${v}` }))),
    r.row_filters.length ? el("p", { class: "meta", text: "Row filters on: " + r.row_filters.join(", ") }) : null,
    r.aggregate_only.length ? el("p", { class: "meta", text: "Aggregate-only (min group 5): " + r.aggregate_only.join(", ") }) : null));
  out.append(g);
  return out;
}

function viewEvals() {
  const out = el("section");
  const cats = ["all", ...new Set(D.cases.map((c) => c.category))];
  out.append(el("h2", { text: "Eval dataset" }),
    el("p", { class: "lead", text: "evals/datasets/dev.yaml: each case is a question asked as a specific user, the behaviour we expect, and for answerable cases a gold query run as an unrestricted admin. The result shown under each gold query is its real output on this warehouse; the agent's answer must match it." }));
  const chips = el("div", { class: "chips" });
  const list = el("div", { class: "stack" });
  const expectPill = { answer: "p-ok", clarify: "p-warn", refuse: "p-bad" };
  function draw() {
    chips.textContent = ""; list.textContent = "";
    for (const c of cats) {
      const n = c === "all" ? D.cases.length : D.cases.filter((x) => x.category === c).length;
      chips.append(el("button", { type: "button", class: "chip", "aria-pressed": String(state.cat === c), text: `${c.replace("_", " ")} (${n})`, onclick: () => { state.cat = c; draw(); } }));
    }
    for (const c of D.cases.filter((x) => state.cat === "all" || x.category === state.cat)) {
      const who = c.user.role + (c.user.regions ? ` (${c.user.regions.join(",")})` : "");
      const card = el("div", { class: "card" },
        el("div", { class: "row" }, el("span", { class: "name", text: c.id }), el("span", { class: "pill", text: c.category.replace("_", " ") }),
          el("span", { class: "pill " + expectPill[c.expect], text: "expect: " + c.expect }), el("span", { class: "meta", text: "as " + who }),
          c.oracle_pass === true ? el("span", { class: "pill p-ok", text: "oracle ✓" }) : c.oracle_pass === false ? el("span", { class: "pill p-bad", text: "oracle ✗" }) : null),
        el("p", { class: "q", text: c.question }),
        c.expect === "clarify" ? el("p", { class: "meta", text: `Must ask about: ${c.clarify_slots.join(", ")} · then the user replies "${c.follow_up}"` }) : null,
        c.note ? el("p", { class: "meta", text: "Note: " + c.note }) : null);
      if (c.gold) {
        card.append(el("details", {}, el("summary", { text: `Gold SQL and result (${num(c.gold.row_count)} row${c.gold.row_count === 1 ? "" : "s"}${c.ordered ? ", order matters" : ""})` }),
          el("pre", { text: c.gold_sql }), table(c.gold.columns, c.gold.rows),
          c.gold.row_count > c.gold.rows.length ? el("p", { class: "meta", text: `First ${c.gold.rows.length} of ${num(c.gold.row_count)} rows.` }) : null));
      } else {
        card.append(el("p", { class: "meta", text: "No gold query: the agent must refuse, and must not return any rows." }));
      }
      list.append(card);
    }
  }
  draw();
  out.append(chips, list);
  return out;
}

const VIEWS = { sources: viewSources, tables: viewTables, queries: viewQueries, access: viewAccess, evals: viewEvals };
function route() {
  let h = location.hash.replace("#", "");
  if (!VIEWS[h]) h = "sources";
  for (const a of document.querySelectorAll("nav.tabs a")) { if (a.getAttribute("href") === "#" + h) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  const m = $("#main"); m.textContent = ""; m.append(VIEWS[h]());
}
window.addEventListener("hashchange", route);
route();
</script>
