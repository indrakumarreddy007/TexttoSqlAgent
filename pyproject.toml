[project]
name = "txt2sql-agent"
version = "0.1.0"
description = "Agentic, governed text-to-SQL over an enterprise-style warehouse (LangGraph + sqlglot + DuckDB)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "sqlglot>=25.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "faker>=25.0",
  "pandas>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
anthropic = ["langchain-anthropic>=0.3"]
observability = ["langfuse>=2.0"]
ui = ["streamlit>=1.40"]
openai = ["langchain-openai>=0.2"]  # OpenAI-compatible hosts: Groq, vLLM, LM Studio
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
sqlagent = "sqlagent.cli:main"
sqlagent-api = "sqlagent.api.app:serve"
sqlagent-eval = "sqlagent.evaluation.harness:main"
halcyon-warehouse = "warehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sqlagent*", "warehouse*"]

[tool.setuptools.package-data]
"sqlagent.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs a running LLM (excluded by default)"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ISC", "BLE", "S608"]
ignore = ["S608"]  # building SQL strings is this project's purpose; guarded by the engine

[tool.ruff.lint.per-file-ignores]
"src/warehouse/*" = ["BLE001", "E402"]
"src/sqlagent/guardrails/engine.py" = ["BLE001"]
"tests/conftest.py" = ["E402"]
"apps/*" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
