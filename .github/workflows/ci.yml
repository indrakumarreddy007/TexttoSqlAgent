name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SQLAGENT_OFFLINE: "1"   # synthetic FX in CI; no network dependency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Security corpus (release gate)
        run: pytest -q tests/security
      - name: Integration tests (warehouse, policy, graph, API, evals)
        run: pytest -q tests/integration
      - name: Build sample warehouse (same schema as Kaggle)
        run: |
          halcyon-warehouse sample
          halcyon-warehouse build
      - name: Oracle eval (gold answers through the full pipeline) - release gate
        run: sqlagent-eval --mode oracle --gate
      - name: Docker image builds
        run: docker build -f deploy/Dockerfile -t halcyon-sql-copilot:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/last-oracle.*
