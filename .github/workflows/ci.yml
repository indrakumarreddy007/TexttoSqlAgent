name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SQLAGENT_OFFLINE: "1"   # synthetic FX in CI; no network dependency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit, security corpus, policy, graph and API tests
        run: pytest -q
      - name: Build sample warehouse (same schema as Kaggle)
        run: |
          python setup/make_sample_data.py
          python setup/build_warehouse.py
      - name: Oracle eval (gold answers through the full pipeline) - release gate
        run: python eval/run_eval.py --mode oracle --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/last-oracle.*
