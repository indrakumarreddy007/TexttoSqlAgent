# Local stack: API + Ollama (free, local LLM).
#   docker compose up -d ollama && docker compose exec ollama ollama pull qwen2.5-coder:7b
#   docker compose run --rm api python setup/build_warehouse.py     # after data/raw is populated
#   docker compose up -d api
# Tracing: run Langfuse's own self-hosted compose (https://langfuse.com/self-hosting) and set
# SQLAGENT_LANGFUSE_ENABLED=true plus LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST in .env.
services:
  ollama:
    image: ollama/ollama:0.5.7
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SQLAGENT_LLM_PROVIDER: ollama
      SQLAGENT_LLM_BASE_URL: http://ollama:11434
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on: [ollama]

volumes:
  ollama: {}
